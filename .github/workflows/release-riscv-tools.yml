name: Release RISC-V Test Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the tool archive
        required: true
        default: riscv-tools-v1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      RISCV: ${{ github.workspace }}/riscv
      SPIKE_REVISION: 1df65613df9970dc7f5c2f3d1bf343dbb0497828
      PK_REVISION: 2efabd3e6604b8a9e8f70baf52f57696680c7855
      ARCHIVE: riscv-test-tools-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf device-tree-compiler libboost-all-dev m4 pkg-config wget

      - name: Install prebuilt RISC-V compiler
        run: |
          wget -q https://github.com/zyedidia/riscv-gnu-toolchain-prebuilt/releases/download/v1/riscv64-unknown-elf-multilib.tar.gz
          tar -xzf riscv64-unknown-elf-multilib.tar.gz
          rm riscv64-unknown-elf-multilib.tar.gz
          echo "$RISCV/bin" >> "$GITHUB_PATH"

      - name: Build Spike
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git spike
          git -C spike checkout "$SPIKE_REVISION"
          mkdir spike/build
          cd spike/build
          CXXFLAGS="-include cstdint" ../configure --prefix="$RISCV"
          make -j"$(nproc)"
          make install

      - name: Build proxy kernel
        run: |
          git clone https://github.com/riscv-software-src/riscv-pk.git pk
          git -C pk checkout "$PK_REVISION"
          mkdir pk/build
          cd pk/build
          ../configure --prefix="$RISCV" --host=riscv64-unknown-elf
          make -j"$(nproc)"
          make install

      - name: Test RISC-V tools against Tiger
        run: |
          export PATH="$RISCV/bin:$RISCV/riscv64-unknown-elf/bin:$PATH"
          opam install . --deps-only --with-test -y
          opam exec -- dune runtest

      - name: Package RISC-V test tools
        run: tar -czf "$ARCHIVE" riscv

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "$ARCHIVE" \
            --title "RISC-V test tools ${{ inputs.tag }}" \
            --notes "Pinned Spike and proxy-kernel tools for Tiger integration tests."

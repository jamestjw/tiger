name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      RISC_V_TOOLS_URL: https://github.com/${{ github.repository }}/releases/download/riscv-tools-v2/riscv-test-tools-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: Restore opam cache
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ hashFiles('tiger.opam') }}

      - name: Set up dependencies and RISC-V tools
        run: |
          chmod +x scripts/setup-ci.sh
          ./scripts/setup-ci.sh

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

      - name: Check formatting
        run: opam exec -- dune build @fmt
